[project]
name = "wechat-companion-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["tzdata; sys_platform == 'win32'", "cryptography>=45,<51", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8"]
memory = ["langmem==0.0.30", "tokenizers==0.21.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
