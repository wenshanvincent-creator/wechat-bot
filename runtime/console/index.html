<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲸鱼电台 · 控制台</title><link rel="stylesheet" href="/style.css"></head><body>
<section id="login" class="login"><form id="login-form"><div class="whale">◒</div><h1>鲸鱼电台</h1><p>管理她的人设、记忆和想去的聊天。</p><label>管理密码<input id="password" type="password" autocomplete="current-password" required></label><button>进入控制台</button><p id="login-error" role="alert"></p></form></section>
<div id="app" hidden><aside><div class="brand"><span class="whale">◒</span><strong>鲸鱼电台</strong></div><nav id="nav"><button data-page="overview" class="active">运行概览</button><button data-page="personas">人设</button><button data-page="providers">模型 API</button><button data-page="sessions">会话</button><button data-page="accounts">微信账号</button><button data-page="channels">群与好友</button><button data-page="classroom">班级事务</button><button data-page="friends">好友管理</button><button data-page="memory">记忆</button><button data-page="media">图片与表情</button><button data-page="tools">工具与审批</button><button data-page="moments">朋友圈</button><button data-page="settings">运行设置</button></nav><div class="aside-foot">本地控制台<br><small>配置保存后在下一轮生效</small></div></aside>
<main><header><div><p id="crumb">鲸鱼电台</p><h1 id="page-title">运行概览</h1></div><div class="header-actions"><span id="worker-state" class="status">正在连接</span><button id="refresh" class="secondary">刷新</button></div></header><div id="notice" role="status" hidden></div><div id="content"></div></main></div>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title"></h2><button type="button" class="icon" id="close-editor" aria-label="关闭">×</button></div><div id="fields"></div><p id="edit-error" class="error" role="alert"></p><footer><button type="button" id="cancel-editor" class="secondary">取消</button><button type="submit">保存</button></footer></form></dialog><script src="/timetable.js"></script><script src="/app.js"></script></body></html>
